name: Deploy VAK Marketing demo
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Unpack static site
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -iname "*content-spacing-v5.zip" -print -quit)"
          if [ -z "$archive" ]; then
            archive="$(find . -maxdepth 1 -type f -iname "*3d-upgrade-v4.zip" -print -quit)"
          fi
          if [ -z "$archive" ]; then
            archive="$(find . -maxdepth 1 -type f -iname "*revisions-v3.zip" -print -quit)"
          fi
          if [ -z "$archive" ]; then
            archive="$(find . -maxdepth 1 -type f -iname "*.zip" ! -iname "*photos-v2.zip" -print -quit)"
          fi
          test -n "$archive"
          rm -rf _site
          mkdir _site
          unzip -q "$archive" -d _site
          test -f _site/site-3d/index.html
          addon="$(find . -maxdepth 1 -type f -iname "*service-photo-assets-v7.zip" -print -quit)"
          if [ -n "$addon" ]; then
            unzip -q "$addon" -d _site/site-3d
            sed -i 's#</head>#  <link rel="stylesheet" href="assets/css/service-photo-backgrounds.css">\n</head>#' _site/site-3d/index.html
          fi
          performance="$(find . -maxdepth 1 -type f -iname "*interaction-performance-v8.zip" -print -quit)"
          if [ -n "$performance" ]; then
            unzip -oq "$performance" -d _site/site-3d
          fi
          hero="$(find . -maxdepth 1 -type f -iname "*hero-redesign-v9.zip" -print -quit)"
          if [ -n "$hero" ]; then
            unzip -oq "$hero" -d _site/site-3d
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/site-3d
      - id: deployment
        uses: actions/deploy-pages@v4
