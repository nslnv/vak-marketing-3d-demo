name: Deploy VAK Marketing demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -f site-3d/index.html
          rm -rf _site
          mkdir _site
          cp -a site-3d _site/site-3d
          test -f _site/site-3d/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/site-3d
      - id: deployment
        uses: actions/deploy-pages@v4
