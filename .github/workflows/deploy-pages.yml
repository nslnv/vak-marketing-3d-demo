name: Deploy VAK Marketing demo
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Unpack static site
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -iname "*content-spacing-v5.zip" -print -quit)"
          if [ -z "$archive" ]; then
            archive="$(find . -maxdepth 1 -type f -iname "*3d-upgrade-v4.zip" -print -quit)"
          fi
          if [ -z "$archive" ]; then
            archive="$(find . -maxdepth 1 -type f -iname "*revisions-v3.zip" -print -quit)"
          fi
          if [ -z "$archive" ]; then
            archive="$(find . -maxdepth 1 -type f -iname "*.zip" ! -iname "*photos-v2.zip" -print -quit)"
          fi
          test -n "$archive"
          rm -rf _site
          mkdir _site
          unzip -q "$archive" -d _site
          test -f _site/site-3d/index.html
          addon="$(find . -maxdepth 1 -type f -iname "*service-photo-assets-v7.zip" -print -quit)"
          if [ -n "$addon" ]; then
            unzip -q "$addon" -d _site/site-3d
            sed -i 's#</head>#  <link rel="stylesheet" href="assets/css/service-photo-backgrounds.css">\n</head>#' _site/site-3d/index.html
          fi
          performance="$(find . -maxdepth 1 -type f -iname "*interaction-performance-v8.zip" -print -quit)"
          if [ -n "$performance" ]; then
            unzip -oq "$performance" -d _site/site-3d
          fi
          hero="$(find . -maxdepth 1 -type f -iname "*hero-redesign-v9.zip" -print -quit)"
          if [ -n "$hero" ]; then
            unzip -oq "$hero" -d _site/site-3d
          fi
          services_pace="$(find . -maxdepth 1 -type f -iname "*services-pace-v10.zip" -print -quit)"
          if [ -n "$services_pace" ]; then
            unzip -oq "$services_pace" -d _site/site-3d
          fi
          hero_restore="$(find . -maxdepth 1 -type f -iname "*hero-restore-v11.zip" -print -quit)"
          if [ -n "$hero_restore" ]; then
            unzip -oq "$hero_restore" -d _site/site-3d
          fi
          audience_photos="$(find . -maxdepth 1 -type f -iname "*audience-photos-v13.zip" -print -quit)"
          if [ -n "$audience_photos" ]; then
            unzip -oq "$audience_photos" -d _site/site-3d
          fi
          services_pace_v14="$(find . -maxdepth 1 -type f -iname "*services-pace-v14.zip" -print -quit)"
          if [ -n "$services_pace_v14" ]; then
            unzip -oq "$services_pace_v14" -d _site/site-3d
          fi
          about_process_v15="$(find . -maxdepth 1 -type f -iname "*about-process-v15.zip" -print -quit)"
          if [ -n "$about_process_v15" ]; then
            unzip -oq "$about_process_v15" -d _site/site-3d
          fi
          about_process_v16="$(find . -maxdepth 1 -type f -iname "*about-process-v16.zip" -print -quit)"
          if [ -n "$about_process_v16" ]; then
            unzip -oq "$about_process_v16" -d _site/site-3d
          fi
          about_kinetic_v17="$(find . -maxdepth 1 -type f -iname "*about-kinetic-3d-v17.zip" -print -quit)"
          if [ -n "$about_kinetic_v17" ]; then
            unzip -oq "$about_kinetic_v17" -d _site/site-3d
          fi
          sed -i 's#href="assets/css/base.css"#href="assets/css/base.css?v=12"#; s#href="assets/css/sections.css"#href="assets/css/sections.css?v=17"#; s#src="assets/js/i18n.js"#src="assets/js/i18n.js?v=15"#; s#src="assets/js/main.js"#src="assets/js/main.js?v=14"#; s#src="assets/js/scene.js"#src="assets/js/scene.js?v=17"#' _site/site-3d/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/site-3d
      - id: deployment
        uses: actions/deploy-pages@v4
