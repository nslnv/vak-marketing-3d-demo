name: Deploy VAK Marketing site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Запланированные статьи блога (дата в будущем) выходят сами: сайт пересобирается
  # в 00:10 и 09:10 по Кипру (по зимнему времени), сборка берёт статьи с датой не позже сегодня.
  schedule:
    - cron: "10 22 * * *"
    - cron: "10 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -f site-3d/index.html
          rm -rf _site
          mkdir _site
          cp -a site-3d _site/site-3d
          test -f _site/site-3d/index.html
      - name: Build blog
        run: node tools/build-blog.mjs _site/site-3d
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/site-3d
      # С 22.11.2026 deploy-pages через секунду после загрузки иногда не видит артефакт
      # («No artifacts named "github-pages" were found») и выкладка падает. Даём GitHub
      # время зарегистрировать артефакт и при неудаче повторяем ещё два раза.
      - name: Wait for artifact
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before last retry
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 60
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
