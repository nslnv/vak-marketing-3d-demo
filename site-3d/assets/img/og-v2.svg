<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0913"/>
      <stop offset="1" stop-color="#07060d"/>
    </linearGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(130 62) rotate(32) scale(670 520)">
      <stop offset="0" stop-color="#7656e8" stop-opacity=".30"/>
      <stop offset="1" stop-color="#7656e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta" cx="0" cy="0" r="1" gradientTransform="translate(1120 605) rotate(-137) scale(620 430)">
      <stop offset="0" stop-color="#e752ae" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e752ae" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2=".15">
      <stop offset="0" stop-color="#f5f1ff"/>
      <stop offset=".62" stop-color="#ded2ff"/>
      <stop offset="1" stop-color="#efb9df"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f73ff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#f16cc2" stop-opacity=".72"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#violet)"/>
  <rect width="1200" height="630" fill="url(#magenta)"/>

  <!-- Editorial composition: typography is the identity; no generated scene,
       pseudo-logo or decorative "tech" target is used in the share card. -->
  <path d="M80 154H1120" stroke="#f1edff" stroke-opacity=".13"/>
  <path d="M80 155H258" stroke="url(#edge)" stroke-width="2"/>
  <path d="M80 520H1120" stroke="#f1edff" stroke-opacity=".13"/>
  <path d="M80 521H372" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="Manrope, Arial, Helvetica, sans-serif">
    <text x="80" y="111" fill="#f7f4ff" font-size="38" font-weight="700" letter-spacing="-1.3">VAK<tspan fill="#b8b0ce" font-weight="300"> Marketing</tspan></text>

    <text x="80" y="288" fill="url(#headline)" font-size="66" font-weight="300" letter-spacing="-3.1">Стратегия, PR и B2B</text>
    <text x="80" y="367" fill="url(#headline)" font-size="66" font-weight="300" letter-spacing="-3.1">для сложных рынков</text>
    <text x="84" y="433" fill="#b9b1cd" font-size="28" font-weight="400" letter-spacing="-.55">iGaming · FinTech · Crypto · Web3</text>

    <text x="80" y="575" fill="#9d95b6" font-size="20" font-weight="500" letter-spacing=".15">vakmarketing.com</text>
    <text x="1120" y="575" fill="#9d95b6" font-size="18" font-weight="500" letter-spacing="1.7" text-anchor="end">MARKETING SYSTEMS</text>

    <text x="742" y="475" fill="#c8baff" fill-opacity=".11" font-size="250" font-weight="700" letter-spacing="-17">VAK</text>
  </g>
</svg>
